# 
# for MySQL 8+ unit test
# 
poolName=unittest_mysql8
jdbcUrl=jdbc:mysql://192.168.220.222:3306/unittestdb
username=unittest
password=1234567890-=aa
autoCommit=false
# A 30-second timeout means that a connection pool queueing failure takes 30 seconds to surface. 
# Worse, during these 30 seconds all Tomcat threads are waiting, and the entire application becomes unresponsive. 
# It is recommended to set it to 3-5 seconds; failing fast is better than slow deadlock.
connectionTimeout=5000
# keepaliveTime=60000, which is 60 seconds, so there is approximately a heartbeat check every 60 seconds.
keepaliveTime=60000
minimumIdle=10
maximumPoolSize=50
driverClassName=com.mysql.cj.jdbc.Driver